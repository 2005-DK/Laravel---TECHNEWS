name: CI and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.1', '8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, xml, sqlite, pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Install NPM dependencies
        run: npm ci --silent

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite || true

      - name: Run Laravel Pint (format check)
        run: ./vendor/bin/pint --test || true

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --colors=always

      - name: Build frontend (assets)
        run: npm run build

  deploy:
    name: Deploy to Server (SSH)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch --all
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force || true
            npm ci --silent
            npm run build
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            # reload PHP-FPM (may vary by host)
            sudo systemctl reload php8.1-fpm || true

    # Notes:
    # - Configure repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY, DEPLOY_PATH (and optionally DEPLOY_PORT)
    # - This deploy step runs only if DEPLOY_HOST secret is defined
