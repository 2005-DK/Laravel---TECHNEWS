<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <g fill="#0ea5a4" font-family="Arial, Helvetica, sans-serif">
    <rect x="40" y="40" width="560" height="80" rx="8" fill="#064e3b" opacity="0.9"/>
    <text x="320" y="90" font-size="24" text-anchor="middle" fill="#a7f3d0">TECHNEWS — Demo</text>

    <rect x="60" y="140" width="160" height="160" rx="8" fill="#065f46"/>
    <rect x="260" y="140" width="160" height="160" rx="8" fill="#047857"/>
    <rect x="460" y="140" width="160" height="160" rx="8" fill="#059669"/>

    <text x="140" y="230" font-size="14" text-anchor="middle" fill="#b7f5e4">Homepage</text>
    <text x="340" y="230" font-size="14" text-anchor="middle" fill="#b7f5e4">Article</text>
    <text x="540" y="230" font-size="14" text-anchor="middle" fill="#b7f5e4">Dashboard</text>
  </g>

  <!-- simple slide animation -->
  <g id="slide" transform="translate(0,0)">
    <rect x="60" y="140" width="160" height="160" rx="8" fill="#064e3b" opacity="0.0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="260" y="140" width="160" height="160" rx="8" fill="#047857" opacity="0.0">
      <animate attributeName="opacity" values="0;0;1;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="460" y="140" width="160" height="160" rx="8" fill="#059669" opacity="0.0">
      <animate attributeName="opacity" values="0;0;0;1" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
