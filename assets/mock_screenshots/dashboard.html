<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TECHNEWS — Admin Dashboard (Mock)</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  </head>
  <body class="bg-gray-100">
    <div class="min-h-screen flex">
      <aside class="w-64 bg-white border-r p-6">
        <h3 class="font-bold">Admin</h3>
        <nav class="mt-6 text-sm text-gray-700 space-y-3">
          <div>Dashboard</div>
          <div>Articles</div>
          <div>Categories</div>
          <div>Users</div>
        </nav>
      </aside>
      <main class="flex-1 p-8">
        <h1 class="text-2xl font-semibold">Dashboard</h1>
        <div class="grid grid-cols-3 gap-6 mt-6">
          <div class="bg-white p-4 rounded shadow">Total Articles<br><span class="text-2xl font-bold">128</span></div>
          <div class="bg-white p-4 rounded shadow">Pending Comments<br><span class="text-2xl font-bold">5</span></div>
          <div class="bg-white p-4 rounded shadow">Users<br><span class="text-2xl font-bold">342</span></div>
        </div>
      </main>
    </div>
  </body>
</html>
