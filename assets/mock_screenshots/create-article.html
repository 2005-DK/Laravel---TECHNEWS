<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TECHNEWS — Create Article (Mock)</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  </head>
  <body class="bg-gray-50">
    <div class="container mx-auto p-8">
      <h1 class="text-2xl font-semibold">Create Article</h1>
      <form class="mt-6 space-y-4 bg-white p-6 rounded shadow">
        <div>
          <label class="block text-sm font-medium">Title</label>
          <input class="mt-1 w-full border rounded p-2" placeholder="Article title">
        </div>
        <div>
          <label class="block text-sm font-medium">Content</label>
          <textarea class="mt-1 w-full border rounded p-2 h-40" placeholder="Write the article..."></textarea>
        </div>
        <div class="flex justify-end">
          <button class="bg-blue-600 text-white px-4 py-2 rounded">Publish</button>
        </div>
      </form>
    </div>
  </body>
</html>
